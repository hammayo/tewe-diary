services:

  db:
    image: postgres:latest
    restart: always
    environment:
      - POSTGRES_USER=dev-user
      - POSTGRES_PASSWORD=changeme
      - POSTGRES_DB=movies
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dev-user -d movies']
      interval: 5s
      timeout: 5s
      retries: 10
