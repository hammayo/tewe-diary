name: Deploy

# Build → test → push images (Movies.Api + Identity.Api) → migrate (DDL role) → deploy both to
# staging slots → warm → swap. Migrations run BEFORE the swap; keep them backward-compatible
# (expand/contract) so the old image keeps serving until the swap instant.
#
# Required GitHub configuration:
#   secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID   (OIDC federated identity)
#   vars:    ACR_NAME, ACR_LOGIN_SERVER, RESOURCE_GROUP, KEY_VAULT_NAME, PG_SERVER_NAME,
#            MIGRATION_CONNECTION_SECRET,
#            WEBAPP_NAME, SLOT_NAME,                     (Movies.Api Web App + slot)
#            IDENTITY_WEBAPP_NAME, IDENTITY_SLOT_NAME    (Identity.Api Web App + slot)
# Azure prerequisites (one-time):
#   - Federated credential on the app registration for this repo/environment.
#   - Two Web Apps for Containers (Movies + Identity), each with its staging slot and a managed
#     identity holding AcrPull on the ACR (Movies also needs get/list on the Key Vault);
#     app setting WEBSITES_PORT=8080 on both.
#   - Movies app settings: KeyVault:Uri, Database:SslMode=Require, Database:MigrateOnStartup=false.
#   - Identity app settings: JWT_TOKEN_SECRET, JWT_ISSUER, JWT_AUDIENCE — these MUST match the
#     values Movies.Api validates with, or issued tokens will be rejected.
#   - Flexible Server uses public access; the OIDC identity can manage its firewall rules.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC login to Azure
  contents: read

env:
  DOTNET_VERSION: '9.0.x'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      # Testcontainers uses the Docker daemon preinstalled on ubuntu-latest.
      - run: dotnet test TeweRestApi.sln --configuration Release

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push images
        run: |
          set -euo pipefail
          az acr login --name "${{ vars.ACR_NAME }}"
          MOVIES_IMAGE="${{ vars.ACR_LOGIN_SERVER }}/movies-api:${GITHUB_SHA}"
          IDENTITY_IMAGE="${{ vars.ACR_LOGIN_SERVER }}/identity-api:${GITHUB_SHA}"
          docker build -t "$MOVIES_IMAGE" -f Dockerfile .
          docker build -t "$IDENTITY_IMAGE" -f Dockerfile.identity .
          docker push "$MOVIES_IMAGE"
          docker push "$IDENTITY_IMAGE"
          echo "MOVIES_IMAGE=$MOVIES_IMAGE" >> "$GITHUB_ENV"
          echo "IDENTITY_IMAGE=$IDENTITY_IMAGE" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Migrate database
        env:
          RULE_NAME: ghdeploy-${{ github.run_id }}
        run: |
          set -euo pipefail
          RUNNER_IP="$(curl -fsSL https://api.ipify.org)"
          az postgres flexible-server firewall-rule create \
            -g "${{ vars.RESOURCE_GROUP }}" -n "${{ vars.PG_SERVER_NAME }}" \
            --rule-name "$RULE_NAME" \
            --start-ip-address "$RUNNER_IP" --end-ip-address "$RUNNER_IP"
          trap 'az postgres flexible-server firewall-rule delete -g "${{ vars.RESOURCE_GROUP }}" -n "${{ vars.PG_SERVER_NAME }}" --rule-name "$RULE_NAME" --yes || true' EXIT

          CS="$(az keyvault secret show --vault-name "${{ vars.KEY_VAULT_NAME }}" \
                --name "${{ vars.MIGRATION_CONNECTION_SECRET }}" --query value -o tsv)"
          Database__ConnectionString="$CS" dotnet run --project Ops.Tools/Movies.DbTool -c Release -- migrate

      - name: Deploy images to staging slots
        run: |
          set -euo pipefail
          az webapp config container set \
            -g "${{ vars.RESOURCE_GROUP }}" -n "${{ vars.WEBAPP_NAME }}" \
            --slot "${{ vars.SLOT_NAME }}" \
            --container-image-name "$MOVIES_IMAGE" \
            --container-registry-url "https://${{ vars.ACR_LOGIN_SERVER }}"
          az webapp config container set \
            -g "${{ vars.RESOURCE_GROUP }}" -n "${{ vars.IDENTITY_WEBAPP_NAME }}" \
            --slot "${{ vars.IDENTITY_SLOT_NAME }}" \
            --container-image-name "$IDENTITY_IMAGE" \
            --container-registry-url "https://${{ vars.ACR_LOGIN_SERVER }}"

      - name: Warm staging slots
        run: |
          set -euo pipefail
          warm() {
            local url="$1"
            for i in $(seq 1 12); do
              if curl -fsS "$url" >/dev/null; then echo "healthy: $url"; return 0; fi
              echo "waiting ($i) for $url..."; sleep 10
            done
            echo "Slot did not become healthy: $url" >&2
            return 1
          }
          warm "https://${{ vars.WEBAPP_NAME }}-${{ vars.SLOT_NAME }}.azurewebsites.net/_health"
          warm "https://${{ vars.IDENTITY_WEBAPP_NAME }}-${{ vars.IDENTITY_SLOT_NAME }}.azurewebsites.net/_health"

      - name: Swap staging into production
        run: |
          set -euo pipefail
          az webapp deployment slot swap \
            -g "${{ vars.RESOURCE_GROUP }}" -n "${{ vars.WEBAPP_NAME }}" \
            --slot "${{ vars.SLOT_NAME }}" --target-slot production
          az webapp deployment slot swap \
            -g "${{ vars.RESOURCE_GROUP }}" -n "${{ vars.IDENTITY_WEBAPP_NAME }}" \
            --slot "${{ vars.IDENTITY_SLOT_NAME }}" --target-slot production
