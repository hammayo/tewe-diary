name: Frontend

# Builds the React app. Runs only when frontend/ changes, so backend changes do not trigger it.
on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The same targets as local work (frontend/Dockerfile): lint, typecheck and unit tests, then the production image.
      - run: docker build --target test frontend
      - run: docker build frontend
