services:

  db:
    image: postgres:latest
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      # Persist data across `docker compose down`/`up` (removed only by `down -v`).
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # `docker compose up` runs the whole stack (db + identity + movies). run.sh remains the
  # dotnet-based dev loop and only starts the db service, so it is unaffected.
  identity-api:
    build:
      context: .
      dockerfile: Dockerfile.identity
    restart: unless-stopped
    ports:
      - '5003:8080'   # HTTP
      - '7003:8081'   # HTTPS
    volumes:
      - ./.certs:/https:ro   # ASP.NET dev cert (see scripts/stack-up.sh)
    environment:
      - ASPNETCORE_ENVIRONMENT=Development   # enables Swagger at /swagger
      # Add an HTTPS listener on 8081 alongside the HTTP one on 8080.
      - ASPNETCORE_HTTPS_PORTS=8081
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnet-dev.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=${ASPNETCORE_DEV_CERT_PASSWORD}
      # Redirect http->https to the host-mapped HTTPS port (7003), not the container's 8081.
      - HTTPS_PORT=7003
      - JWT_TOKEN_SECRET=${JWT_TOKEN_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}

  movies-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '5001:8080'   # HTTP
      - '7001:8081'   # HTTPS
    volumes:
      - ./.certs:/https:ro   # ASP.NET dev cert (see scripts/stack-up.sh)
    environment:
      - ASPNETCORE_ENVIRONMENT=Development   # enables Swagger at /swagger
      # Add an HTTPS listener on 8081 alongside the HTTP one on 8080.
      - ASPNETCORE_HTTPS_PORTS=8081
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnet-dev.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=${ASPNETCORE_DEV_CERT_PASSWORD}
      # Redirect http->https to the host-mapped HTTPS port (7001), not the container's 8081.
      - HTTPS_PORT=7001
      # Reach Postgres over the compose network, not localhost.
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - Database__SslMode=Disable            # local docker Postgres has no TLS
      - Database__MigrateOnStartup=true      # apply migrations on boot for local runs
      # Must match Identity.Api so issued tokens validate.
      - JWT_TOKEN_SECRET=${JWT_TOKEN_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - API_KEY=${API_KEY}

volumes:
  pgdata:
